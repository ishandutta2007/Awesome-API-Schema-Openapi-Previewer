<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(18px) translateX(-12px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 250px 120px;
    }
    .orb-2 {
      animation: pulseGlow 8s ease-in-out infinite 2s;
      transform-origin: 950px 300px;
    }
    .float-item-1 {
      animation: floatParticle1 5s ease-in-out infinite;
    }
    .float-item-2 {
      animation: floatParticle2 6s ease-in-out infinite 1s;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashCycle 20s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Background Animated Glowing Orbs (Kept safely in background) -->
  <g opacity="0.4">
    <circle class="orb-1" cx="220" cy="100" r="160" fill="#06b6d4" filter="url(#softGlow)" />
    <circle class="orb-2" cx="980" cy="300" r="180" fill="#8b5cf6" filter="url(#softGlow)" />
    <circle cx="600" cy="380" r="140" fill="#3b82f6" filter="url(#softGlow)" opacity="0.25" />
  </g>

  <!-- Animated Decorative Flow Circuit Lines (in background) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="stream-line" d="M 50 350 Q 350 400 650 340 T 1150 350" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Subtle Floating Decorative UI Nodes (Left and Right Corners) -->
  <g class="float-item-1" opacity="0.75">
    <!-- Left Decorative Code Card -->
    <rect x="60" y="240" width="170" height="90" rx="8" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
    <circle cx="80" cy="258" r="4" fill="#ef4444" />
    <circle cx="95" cy="258" r="4" fill="#f59e0b" />
    <circle cx="110" cy="258" r="4" fill="#10b981" />
    <text x="80" y="285" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">GET /api/v3/schema</text>
    <rect x="80" y="298" width="110" height="6" rx="3" fill="#475569" opacity="0.6" />
    <rect x="80" y="310" width="70" height="6" rx="3" fill="#475569" opacity="0.4" />
  </g>

  <g class="float-item-2" opacity="0.75">
    <!-- Right Decorative Spec Card -->
    <rect x="970" y="70" width="170" height="95" rx="8" fill="url(#pillGrad1)" stroke="#334155" stroke-width="1" />
    <rect x="985" y="85" width="60" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="993" y="98" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">200 OK</text>
    <text x="985" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">openapi: 3.1.0</text>
    <rect x="985" y="132" width="130" height="5" rx="2.5" fill="#475569" opacity="0.5" />
    <rect x="985" y="142" width="90" height="5" rx="2.5" fill="#475569" opacity="0.3" />
  </g>

  <!-- FOREGROUND: Header Brand & Title (Clean & Centered) -->
  <g>
    <!-- Tag Pill Badge -->
    <rect x="475" y="45" width="250" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <circle cx="495" cy="61" r="5" fill="#38bdf8" />
    <text x="510" y="67" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED DEVELOPER LIST</text>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome OpenAPI &amp; API Schema Previewers
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Top Open-Source Renderers, Interactive Documentation UIs &amp; Developer Portals
    </text>

    <!-- Feature Pills in Center (Safe Foreground) -->
    <g transform="translate(240, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="75" y="24" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ OpenAPI 3.1 &amp; 3.0</text>

      <!-- Pill 2 -->
      <rect x="170" y="0" width="180" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="260" y="24" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌟 Interactive Renderers</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="170" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="455" y="24" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛠️ Developer Portals</text>

      <!-- Pill 4 -->
      <rect x="560" y="0" width="160" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="640" y="24" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 Zero-Config Specs</text>
    </g>

    <!-- Bottom Highlights Caption -->
    <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Swagger UI • Redoc • Scalar • Stoplight Elements • RapiDoc • Mintlify • Fern • ReadMe
    </text>
  </g>
</svg>
